{{template "layout" .}}
{{define "content"}}
<h1>Quotes</h1>
<p><a href="/quotes/new">New Quote</a></p>
<table>
    <tr>
        <th>#</th>
        <th>Quote</th>
        <th>Date</th>
        <th>Actions</th>
    </tr>
    {{range .Quotes}}
    <tr>
        <td>{{.ID}}</td>
        <td>{{.Text}}</td>
        <td>{{.CreatedAt.Format "2006-01-02"}}</td>
        <td>
            <a href="/quotes/{{.ID}}/edit">Edit</a>
            <form method="POST" action="/quotes/{{.ID}}/delete" class="inline">
                <button type="submit" onclick="return confirm('Delete quote #{{.ID}}?')">Delete</button>
            </form>
        </td>
    </tr>
    {{else}}
    <tr><td colspan="4">No quotes yet.</td></tr>
    {{end}}
</table>
{{end}}
